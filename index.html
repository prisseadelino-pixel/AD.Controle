<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AD Contrôle</title>

  <!-- ICÔNE AD CONTRÔLE DE L'APPLICATION -->
  <link rel="icon" type="image/png" href="https://i.servimg.com/u/f49/11/31/89/70/17848310.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root {
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --secondary: #1e293b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --border: #cbd5e1;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* --- ACCUEIL --- */
    #home-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      text-align: center;
      background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
    }

    .logo-container {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .home-logo-img {
      width: 85vw !important;
      max-width: 600px !important;
      height: auto !important;
      max-height: 350px !important;
      object-fit: contain;
      filter: contrast(135%) brightness(112%);
      mix-blend-mode: multiply;
      display: block;
    }

    .app-subtitle {
      font-size: 1.1rem;
      color: #64748b;
      max-width: 480px;
      margin-bottom: 2rem;
      line-height: 1.4;
    }

    .btn-start {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 30px;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(234, 88, 12, 0.4);
      transition: all 0.2s ease;
    }

    /* --- APPLICATION --- */
    #app-screen {
      display: none;
      max-width: 800px;
      margin: 0 auto;
      padding: 1rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.5rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--border);
      gap: 0.5rem;
    }

    .header-brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex: 1;
    }

    .header-brand img {
      max-height: 65px !important;
      width: auto !important;
      object-fit: contain;
      flex-shrink: 0;
      filter: contrast(135%) brightness(112%);
      mix-blend-mode: multiply;
    }

    .header-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      position: relative;
      gap: 0.3rem;
    }

    .btn-nav-home {
      background: transparent;
      border: 1px solid var(--border);
      color: #64748b;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      flex-shrink: 0;
    }

    .btn-menu-hamburger {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--secondary);
      padding: 0.25rem 0.6rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      width: fit-content;
    }

    .dropdown-menu {
      display: none;
      position: absolute;
      top: 100%;
      right: 0;
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      z-index: 100;
      min-width: 200px;
      overflow: hidden;
      margin-top: 0.4rem;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      width: 100%;
      padding: 0.75rem 1rem;
      text-align: left;
      background: none;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: background 0.2s ease;
    }

    .dropdown-item.danger {
      color: #ef4444;
    }

    .dropdown-item:hover {
      background: #f1f5f9;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
    }

    .search-box {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .search-box input {
      flex: 1;
    }

    .btn-search {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease;
    }

    .btn-search:hover {
      background-color: var(--primary-hover);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .photo-box-container {
      background: #f1f5f9;
      padding: 0.85rem;
      border-radius: 10px;
      border: 1px dashed var(--border);
      margin-bottom: 1rem;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
    }

    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 1rem;
    }

    .photo-preview {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 8px;
      display: none;
      margin-bottom: 0.75rem;
      border: 1px solid var(--border);
    }

    .camera-controls {
      display: flex;
      gap: 0.5rem;
    }

    button.btn-main {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      font-size: 1rem;
    }

    button.btn-secondary {
      background-color: #64748b;
      color: white;
      border: none;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .export-filter-container {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 0.75rem;
      background: #f1f5f9;
      padding: 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .export-filter-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--secondary);
    }

    .export-actions-row {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .input-date-custom {
      flex: 1;
      min-width: 140px;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      font-size: 0.9rem;
      color: var(--text);
      outline: none;
      background: white;
    }

    button.btn-pdf {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
      white-space: nowrap;
    }

    button.btn-pdf:hover {
      background-color: #0369a1;
    }

    .section-header {
      margin-bottom: 0.5rem;
    }

    .liste-commandes {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin-top: 1rem;
    }

    .commande-item-compact {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.75rem 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .commande-item-compact:hover {
      background: #f1f5f9;
    }

    .commande-main-btn {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      flex-grow: 1;
    }

    .commande-num-badge {
      font-weight: bold;
      font-size: 1.05rem;
      color: var(--primary);
    }

    .commande-date-compact {
      font-size: 0.75rem;
      color: #64748b;
    }

    .commande-actions {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .btn-edit-small {
      background: #ffffff;
      border: 1px solid var(--border);
      color: var(--secondary);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-edit-small:hover {
      background: var(--border);
    }

    .btn-delete-small {
      background: #fef2f2;
      border: 1px solid #fca5a5;
      color: #ef4444;
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-delete-small:hover {
      background: #fee2e2;
    }

    /* MODAL DE ZOOM AVEC LES 3 PHOTOS */
    .modal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      flex-direction: column;
      overflow-y: auto;
    }

    .modal-content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      max-width: 95%;
      margin: auto;
    }

    .modal-images-row {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 100%;
    }

    .modal-images-row img {
      max-width: 30vw;
      max-height: 60vh;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      object-fit: contain;
    }

    @media (max-width: 768px) {
      .modal-images-row {
        flex-direction: column;
      }
      .modal-images-row img {
        max-width: 90vw;
        max-height: 35vh;
      }
    }

    .modal-notes {
      color: white;
      background: rgba(15, 23, 42, 0.8);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      max-width: 500px;
      text-align: center;
      font-size: 0.95rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .modal-close {
      position: absolute;
      top: 20px;
      right: 25px;
      color: white;
      font-size: 2rem;
      font-weight: bold;
      cursor: pointer;
      z-index: 1001;
    }

    @media print {
      body * {
        visibility: hidden;
      }
      #print-area, #print-area * {
        visibility: visible;
      }
      #print-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        padding: 20px;
      }
      .print-title {
        font-size: 22px;
        color: #ea580c;
        margin-bottom: 5px;
        font-weight: bold;
      }
      .print-subtitle {
        font-size: 12px;
        color: #64748b;
        margin-bottom: 20px;
        border-bottom: 2px solid #ea580c;
        padding-bottom: 10px;
      }
      .print-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
      }
      .print-card {
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        padding: 10px;
        page-break-inside: avoid;
        background: #ffffff;
      }
      .print-card h3 {
        font-size: 16px;
        color: #0f172a;
        margin-bottom: 4px;
      }
      .print-card .date {
        font-size: 11px;
        color: #64748b;
        margin-bottom: 8px;
      }
      .print-photos-flex {
        display: flex;
        gap: 6px;
      }
      .print-photos-flex img {
        flex: 1;
        height: 120px;
        object-fit: cover;
        border-radius: 6px;
        border: 1px solid #e2e8f0;
      }
      .print-card .notes {
        font-size: 12px;
        color: #334155;
        margin-top: 6px;
        font-style: italic;
      }
    }
  </style>
</head>
<body>

  <!-- ACCUEIL -->
  <div id="home-screen">
    <div class="logo-container">
      <a href="https://servimg.com/view/11318970/307" target="_blank">
        <img class="home-logo-img" src="https://i.servimg.com/u/f49/11/31/89/70/17848310.png" style="border:0;" alt="AD Contrôle Logo" />
      </a>
    </div>
    <p class="app-subtitle">Prenez en photo vos préparations de commandes et gardez une preuve visuelle incontestable.</p>
    <button class="btn-start" id="btnCommencer">🚀 Lancer les préparations</button>
  </div>

  <!-- APPLICATION -->
  <div id="app-screen">
    <header>
      <div class="header-brand">
        <a href="https://servimg.com/view/11318970/307" target="_blank">
          <img src="https://i.servimg.com/u/f49/11/31/89/70/17848310.png" style="border:0;" alt="AD Contrôle Logo" />
        </a>
      </div>
      
      <div class="header-controls">
        <button class="btn-nav-home" id="btnRetourAccueil">🏠 Accueil</button>
        <button class="btn-menu-hamburger" id="btnMenu" title="Menu options">☰</button>
        
        <div class="dropdown-menu" id="dropdownMenu">
          <button class="dropdown-item danger" id="btnViderHistorique">
            🗑️ Vider l'historique
          </button>
        </div>
      </div>
    </header>

    <!-- SECTION RECHERCHE -->
    <section class="card" style="padding: 1rem;">
      <div class="search-box">
        <input type="text" id="recherche" placeholder="🔍 Rechercher par numéro..." autocomplete="off">
        <button type="button" class="btn-search" id="btnLancerRecherche">Rechercher</button>
      </div>
    </section>

    <!-- NOUVELLE PREPARATION -->
    <section class="card" id="sectionPreparation">
      <h2 id="formTitle" style="font-size: 1.1rem; margin-bottom:1rem; color:var(--primary);">Nouvelle Préparation</h2>
      <div class="form-group">
        <label for="numeroCommande">Numéro de Commande</label>
        <input type="text" id="numeroCommande" name="no_autofill_cmd" autocomplete="off">
      </div>

      <!-- PHOTO 1 -->
      <div class="photo-box-container">
        <label>📸 Photo 1 (Obligatoire)</label>
        <img id="photoPreview1" class="photo-preview" alt="Aperçu Photo 1">
        
        <input type="file" id="fileGallery1" accept="image/*" style="display: none;">
        <input type="file" id="fileCamera1" accept="image/*" capture="environment" style="display: none;">
        
        <div class="camera-controls">
          <button type="button" class="btn-secondary" id="btnGalerie1">📁 Galerie 1</button>
          <button type="button" class="btn-secondary" id="btnPhotoDirecte1">📸 Photo 1</button>
        </div>
      </div>

      <!-- PHOTO 2 -->
      <div class="photo-box-container">
        <label>📸 Photo 2 (Optionnelle)</label>
        <img id="photoPreview2" class="photo-preview" alt="Aperçu Photo 2">
        
        <input type="file" id="fileGallery2" accept="image/*" style="display: none;">
        <input type="file" id="fileCamera2" accept="image/*" capture="environment" style="display: none;">
        
        <div class="camera-controls">
          <button type="button" class="btn-secondary" id="btnGalerie2">📁 Galerie 2</button>
          <button type="button" class="btn-secondary" id="btnPhotoDirecte2">📸 Photo 2</button>
        </div>
      </div>

      <!-- PHOTO 3 -->
      <div class="photo-box-container">
        <label>📸 Photo 3 (Optionnelle)</label>
        <img id="photoPreview3" class="photo-preview" alt="Aperçu Photo 3">
        
        <input type="file" id="fileGallery3" accept="image/*" style="display: none;">
        <input type="file" id="fileCamera3" accept="image/*" capture="environment" style="display: none;">
        
        <div class="camera-controls">
          <button type="button" class="btn-secondary" id="btnGalerie3">📁 Galerie 3</button>
          <button type="button" class="btn-secondary" id="btnPhotoDirecte3">📸 Photo 3</button>
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Remarques (optionnel)</label>
        <textarea id="notes" rows="2" placeholder="Ex: Produit fragile, carton réutilisé..." autocomplete="off"></textarea>
      </div>

      <div style="display:flex; gap:0.5rem;">
        <button class="btn-main" id="btnEnregistrer">Enregistrer la préparation</button>
        <button class="btn-secondary" id="btnAnnulerEdit" style="display:none; width:auto;">Annuler</button>
      </div>
    </section>

    <!-- HISTORIQUE DES PREUVES -->
    <section class="card">
      <div class="section-header">
        <h2>Historique des Preuves</h2>
      </div>

      <div class="export-filter-container">
        <span class="export-filter-label">📅 Filtrer par date pour l'export (Optionnel) :</span>
        <div class="export-actions-row">
          <input type="date" id="dateFiltreExport" class="input-date-custom">
          <button class="btn-pdf" id="btnExportPDF">📄 Exporter PDF</button>
        </div>
      </div>

      <div class="liste-commandes" id="galerieCommandes"></div>
    </section>
  </div>

  <div id="print-area"></div>

  <!-- MODAL ZOOM AVEC LES 3 PHOTOS -->
  <div id="imageModal" class="modal">
    <span class="modal-close" id="closeModal">&times;</span>
    <div class="modal-content-container">
      <div class="modal-images-row">
        <img id="modalImg1" src="" alt="Zoom photo 1">
        <img id="modalImg2" src="" alt="Zoom photo 2" style="display:none;">
        <img id="modalImg3" src="" alt="Zoom photo 3" style="display:none;">
      </div>
      <div id="modalNotes" class="modal-notes" style="display: none;"></div>
    </div>
  </div>

  <!-- SDK FIREBASE COMPAT -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyAsYfXgNnrskxOwgX081lv",
      authDomain: "ad-controle.firebaseapp.com",
      databaseURL: "https://ad-controle-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "ad-controle",
      storageBucket: "ad-controle.firebaseapp.com",
      messagingSenderId: "745097117764",
      appId: "1:745097117764:web:59feae933",
      measurementId: "G-RZ3Q22WDH6"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const homeScreen = document.getElementById('home-screen');
    const appScreen = document.getElementById('app-screen');
    const btnCommencer = document.getElementById('btnCommencer');
    const btnRetourAccueil = document.getElementById('btnRetourAccueil');
    const sectionPreparation = document.getElementById('sectionPreparation');

    const btnMenu = document.getElementById('btnMenu');
    const dropdownMenu = document.getElementById('dropdownMenu');

    btnMenu.addEventListener('click', (e) => {
      e.stopPropagation();
      dropdownMenu.classList.toggle('show');
    });

    document.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
    });

    btnCommencer.addEventListener('click', () => {
      homeScreen.style.display = 'none';
      appScreen.style.display = 'block';
      document.getElementById('numeroCommande').value = "";
    });

    btnRetourAccueil.addEventListener('click', () => {
      reinitialiserFormulaire();
      inputRecherche.value = "";
      sectionPreparation.style.display = 'block';
      afficherGalerie();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    let commandes = [];
    let imageCaptureeData1 = "";
    let imageCaptureeData2 = "";
    let imageCaptureeData3 = "";
    let modeEditionId = null;

    const inputNumero = document.getElementById('numeroCommande');
    const inputNotes = document.getElementById('notes');
    
    // PHOTO 1
    const photoPreview1 = document.getElementById('photoPreview1');
    const fileGallery1 = document.getElementById('fileGallery1');
    const fileCamera1 = document.getElementById('fileCamera1');
    const btnGalerie1 = document.getElementById('btnGalerie1');
    const btnPhotoDirecte1 = document.getElementById('btnPhotoDirecte1');

    // PHOTO 2
    const photoPreview2 = document.getElementById('photoPreview2');
    const fileGallery2 = document.getElementById('fileGallery2');
    const fileCamera2 = document.getElementById('fileCamera2');
    const btnGalerie2 = document.getElementById('btnGalerie2');
    const btnPhotoDirecte2 = document.getElementById('btnPhotoDirecte2');

    // PHOTO 3
    const photoPreview3 = document.getElementById('photoPreview3');
    const fileGallery3 = document.getElementById('fileGallery3');
    const fileCamera3 = document.getElementById('fileCamera3');
    const btnGalerie3 = document.getElementById('btnGalerie3');
    const btnPhotoDirecte3 = document.getElementById('btnPhotoDirecte3');

    const btnEnregistrer = document.getElementById('btnEnregistrer');
    const btnAnnulerEdit = document.getElementById('btnAnnulerEdit');
    const formTitle = document.getElementById('formTitle');
    const galerieCommandes = document.getElementById('galerieCommandes');
    const inputRecherche = document.getElementById('recherche');
    const btnLancerRecherche = document.getElementById('btnLancerRecherche');
    const btnViderHistorique = document.getElementById('btnViderHistorique');
    const btnExportPDF = document.getElementById('btnExportPDF');
    const dateFiltreExport = document.getElementById('dateFiltreExport');

    const modal = document.getElementById('imageModal');
    const modalImg1 = document.getElementById('modalImg1');
    const modalImg2 = document.getElementById('modalImg2');
    const modalImg3 = document.getElementById('modalImg3');
    const modalNotes = document.getElementById('modalNotes');
    const closeModal = document.getElementById('closeModal');

    // ECOUTE EN TEMPS REEL DE FIREBASE
    db.ref('commandes').on('value', (snapshot) => {
      const data = snapshot.val();
      commandes = [];
      if (data) {
        Object.keys(data).forEach(key => {
          commandes.push(data[key]);
        });
        commandes.sort((a, b) => b.id - a.id);
      }
      afficherGalerie(inputRecherche.value);
    }, (error) => {
      alert("Erreur de lecture Firebase : " + error.message);
    });

    // COMPRESSION ÉQUILIBRÉE
    function compresserImage(dataUrl, callback) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDimension = 1200;

        if (width > height && width > maxDimension) {
          height *= maxDimension / width;
          width = maxDimension;
        } else if (height > maxDimension) {
          width *= maxDimension / height;
          height = maxDimension;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        callback(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = dataUrl;
    }

    // HANDLERS PHOTO 1
    btnGalerie1.addEventListener('click', () => fileGallery1.click());
    btnPhotoDirecte1.addEventListener('click', () => fileCamera1.click());

    function chargerFichier1(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          compresserImage(event.target.result, (imageCompressée) => {
            imageCaptureeData1 = imageCompressée;
            photoPreview1.src = imageCaptureeData1;
            photoPreview1.style.display = 'block';
          });
        };
        reader.readAsDataURL(file);
      }
    }
    fileGallery1.addEventListener('change', chargerFichier1);
    fileCamera1.addEventListener('change', chargerFichier1);

    // HANDLERS PHOTO 2
    btnGalerie2.addEventListener('click', () => fileGallery2.click());
    btnPhotoDirecte2.addEventListener('click', () => fileCamera2.click());

    function chargerFichier2(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          compresserImage(event.target.result, (imageCompressée) => {
            imageCaptureeData2 = imageCompressée;
            photoPreview2.src = imageCaptureeData2;
            photoPreview2.style.display = 'block';
          });
        };
        reader.readAsDataURL(file);
      }
    }
    fileGallery2.addEventListener('change', chargerFichier2);
    fileCamera2.addEventListener('change', chargerFichier2);

    // HANDLERS PHOTO 3
    btnGalerie3.addEventListener('click', () => fileGallery3.click());
    btnPhotoDirecte3.addEventListener('click', () => fileCamera3.click());

    function chargerFichier3(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          compresserImage(event.target.result, (imageCompressée) => {
            imageCaptureeData3 = imageCompressée;
            photoPreview3.src = imageCaptureeData3;
            photoPreview3.style.display = 'block';
          });
        };
        reader.readAsDataURL(file);
      }
    }
    fileGallery3.addEventListener('change', chargerFichier3);
    fileCamera3.addEventListener('change', chargerFichier3);

    btnEnregistrer.addEventListener('click', () => {
      const numero = inputNumero.value.trim();
      const notes = inputNotes.value.trim();

      if (!numero || !imageCaptureeData1) {
        alert("Veuillez renseigner un numéro de commande et au moins la Photo 1.");
        return;
      }

      btnEnregistrer.disabled = true;
      btnEnregistrer.textContent = "Enregistrement...";

      const idObjet = modeEditionId !== null ? modeEditionId : Date.now();
      const commandeData = {
        id: idObjet,
        numero: numero,
        photo: imageCaptureeData1, // Photo 1 (obligatoire)
        photo2: imageCaptureeData2, // Photo 2 (optionnelle)
        photo3: imageCaptureeData3, // Photo 3 (optionnelle)
        notes: notes,
        date: modeEditionId !== null ? commandes.find(c => c.id === modeEditionId).date : new Date().toLocaleString('fr-FR')
      };

      // SAUVEGARDE DANS FIREBASE
      db.ref('commandes/' + idObjet).set(commandeData)
        .then(() => {
          reinitialiserFormulaire();
          btnEnregistrer.disabled = false;
        })
        .catch((error) => {
          btnEnregistrer.disabled = false;
          btnEnregistrer.textContent = "Enregistrer la préparation";
          alert("❌ ÉCHEC FIREBASE : " + error.message);
        });
    });

    function reinitialiserFormulaire() {
      modeEditionId = null;
      inputNumero.value = "";
      imageCaptureeData1 = "";
      imageCaptureeData2 = "";
      imageCaptureeData3 = "";
      photoPreview1.style.display = 'none';
      photoPreview2.style.display = 'none';
      photoPreview3.style.display = 'none';
      inputNotes.value = "";
      fileGallery1.value = "";
      fileCamera1.value = "";
      fileGallery2.value = "";
      fileCamera2.value = "";
      fileGallery3.value = "";
      fileCamera3.value = "";
      btnEnregistrer.textContent = "Enregistrer la préparation";
      btnEnregistrer.disabled = false;
      btnAnnulerEdit.style.display = "none";
      formTitle.textContent = "Nouvelle Préparation";
    }

    btnAnnulerEdit.addEventListener('click', reinitialiserFormulaire);

    window.editerCommande = function(id, event) {
      if (event) event.stopPropagation();
      const item = commandes.find(c => c.id === id);
      if (!item) return;

      inputRecherche.value = "";
      sectionPreparation.style.display = 'block';

      modeEditionId = id;
      inputNumero.value = item.numero;
      inputNotes.value = item.notes || "";
      
      imageCaptureeData1 = item.photo || "";
      imageCaptureeData2 = item.photo2 || "";
      imageCaptureeData3 = item.photo3 || "";
      
      if (imageCaptureeData1) {
        photoPreview1.src = imageCaptureeData1;
        photoPreview1.style.display = 'block';
      } else {
        photoPreview1.style.display = 'none';
      }

      if (imageCaptureeData2) {
        photoPreview2.src = imageCaptureeData2;
        photoPreview2.style.display = 'block';
      } else {
        photoPreview2.style.display = 'none';
      }

      if (imageCaptureeData3) {
        photoPreview3.src = imageCaptureeData3;
        photoPreview3.style.display = 'block';
      } else {
        photoPreview3.style.display = 'none';
      }

      btnEnregistrer.textContent = "💾 Sauvegarder les modifications";
      btnAnnulerEdit.style.display = "inline-block";
      formTitle.textContent = "✏️ Modifier la commande " + item.numero;
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.supprimerCommande = function(id, event) {
      if (event) event.stopPropagation();
      const item = commandes.find(c => c.id === id);
      if (!item) return;

      if (confirm(`Voulez-vous vraiment supprimer la commande ${item.numero} ?`)) {
        db.ref('commandes/' + id).remove()
          .then(() => {
            if (modeEditionId === id) reinitialiserFormulaire();
          });
      }
    };

    btnViderHistorique.addEventListener('click', () => {
      dropdownMenu.classList.remove('show');
      if (confirm("Voulez-vous vraiment effacer TOUT l'historique de la base de données ?")) {
        db.ref('commandes').remove()
          .then(() => {
            reinitialiserFormulaire();
          });
      }
    });

    function afficherGalerie(filtre = "") {
      galerieCommandes.innerHTML = "";
      const liste = commandes.filter(c => c.numero.toLowerCase().includes(filtre.toLowerCase()));

      if (liste.length === 0) {
        galerieCommandes.innerHTML = `<p style="text-align:center; color:#64748b; padding:1rem;">Aucune commande trouvée.</p>`;
        return;
      }

      liste.forEach(cmd => {
        const item = document.createElement('div');
        item.className = 'commande-item-compact';
        item.onclick = () => ouvrirModal(cmd.photo, cmd.photo2, cmd.photo3, cmd.notes);
        
        let count = 1;
        if (cmd.photo2) count++;
        if (cmd.photo3) count++;
        
        const nbPhotosText = count > 1 ? `📷 (${count} photos)` : `📷 (1 photo)`;

        item.innerHTML = `
          <div class="commande-main-btn">
            <span>${nbPhotosText}</span>
            <div>
              <div class="commande-num-badge">${cmd.numero}</div>
              <div class="commande-date-compact">${cmd.date}</div>
            </div>
          </div>
          <div class="commande-actions">
            <button class="btn-edit-small" onclick="editerCommande(${cmd.id}, event)">✏️ Modifier</button>
            <button class="btn-delete-small" onclick="supprimerCommande(${cmd.id}, event)">❌</button>
          </div>
        `;
        galerieCommandes.appendChild(item);
      });
    }

    window.ouvrirModal = function(src1, src2, src3, notes) {
      modal.style.display = "flex";
      
      modalImg1.src = src1 || "";
      
      if (src2) {
        modalImg2.src = src2;
        modalImg2.style.display = "block";
      } else {
        modalImg2.style.display = "none";
      }

      if (src3) {
        modalImg3.src = src3;
        modalImg3.style.display = "block";
      } else {
        modalImg3.style.display = "none";
      }

      if (notes && notes.trim() !== "") {
        modalNotes.textContent = "💬 " + notes;
        modalNotes.style.display = "block";
      } else {
        modalNotes.style.display = "none";
      }
    };

    closeModal.addEventListener('click', () => modal.style.display = "none");
    modal.addEventListener('click', (e) => {
      if (e.target === modal) modal.style.display = "none";
    });

    function executerRecherche() {
      const valeur = inputRecherche.value.trim();
      if (valeur !== "") {
        sectionPreparation.style.display = 'none';
      } else {
        sectionPreparation.style.display = 'block';
      }
      afficherGalerie(valeur);
    }

    btnLancerRecherche.addEventListener('click', executerRecherche);
    inputRecherche.addEventListener('input', executerRecherche);
    inputRecherche.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') executerRecherche();
    });

    btnExportPDF.addEventListener('click', () => {
      const dateSelect = dateFiltreExport.value;
      let listeAExporter = commandes;
      let titreExport = "Historique Complet des Preuves";

      if (dateSelect) {
        const parts = dateSelect.split('-');
        const dateFormatee = `${parts[2]}/${parts[1]}/${parts0]}`;
        
        listeAExporter = commandes.filter(cmd => cmd.date.startsWith(dateFormatee));
        titreExport = `Historique des Preuves - Date : ${dateFormatee}`;

        if (listeAExporter.length === 0) {
          alert(`Aucune commande trouvée pour la date du ${dateFormatee}.`);
          return;
        }
      } else {
        if (commandes.length === 0) {
          alert("L'historique est vide, aucun document à exporter.");
          return;
        }
      }

      const printArea = document.getElementById('print-area');
      const dateHeureExport = new Date().toLocaleString('fr-FR');

      let html = `
        <div class="print-title">${titreExport}</div>
        <div class="print-subtitle">Document généré le ${dateHeureExport} - Total : ${listeAExporter.length} preuve(s)</div>
        <div class="print-grid">
      `;

      listeAExporter.forEach(cmd => {
        html += `
          <div class="print-card">
            <h3>Commande : ${cmd.numero}</h3>
            <div class="date">Date : ${cmd.date}</div>
            <div class="print-photos-flex">
              <img src="${cmd.photo}" alt="Preuve 1 commande ${cmd.numero}">
              ${cmd.photo2 ? `<img src="${cmd.photo2}" alt="Preuve 2 commande ${cmd.numero}">` : ''}
              ${cmd.photo3 ? `<img src="${cmd.photo3}" alt="Preuve 3 commande ${cmd.numero}">` : ''}
            </div>
            ${cmd.notes ? `<div class="notes">💬 ${cmd.notes}</div>` : ''}
          </div>
        `;
      });

      html += `</div>`;
      printArea.innerHTML = html;

      window.print();
    });
  </script>
</body>
</html>
